services:
  admin-hub:
    build:
      context: ./admin-hub
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  mentor-hub:
    build:
      context: ./mentor-hub
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
    restart: always
    depends_on:
      admin-hub:
        condition: service_healthy
      mentor-hub:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

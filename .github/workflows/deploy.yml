name: Remote Update Trigger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deployment Script via SSH
        uses: appleboy/ssh-action@master
        with:
          host: admin-4be.ptascloud.online
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/careersync-4be-app2
            git pull origin main
            chmod +x deploy.sh
            ./deploy.sh
